# TrackSight - Streamlit configuration
# Streamlit >= 1.46 supports separate [theme.light] / [theme.dark] sections.
# Users can switch them from the app menu (⋮ > Settings), and the app also has
# its own "Appearance" switch (Auto / Light / Dark) in the sidebar.

[theme]
font = "serif"

[theme.light]
base = "light"
primaryColor = "#2b5c8a"
backgroundColor = "#f4f6f9"
secondaryBackgroundColor = "#e6ebf2"
textColor = "#1b2430"

[theme.dark]
base = "dark"
primaryColor = "#6aa6dc"
backgroundColor = "#0f141b"
secondaryBackgroundColor = "#18202b"
textColor = "#e6edf5"

[server]
maxUploadSize = 100
enableXsrfProtection = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
