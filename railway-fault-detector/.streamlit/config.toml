# TrackSight - Streamlit configuration
# Streamlit >= 1.46 supports separate [theme.light] / [theme.dark] sections.
# Users can switch them from the app menu (⋮ > Settings), and the app also has
# its own "Appearance" switch (Auto / Light / Dark) in the sidebar.

[theme]
font = "sans serif"

[theme.light]
base = "light"
primaryColor = "#c77d00"
backgroundColor = "#f6f1e4"
secondaryBackgroundColor = "#ebe4d2"
textColor = "#1c2230"

[theme.dark]
base = "dark"
primaryColor = "#ffb52e"
backgroundColor = "#0f131b"
secondaryBackgroundColor = "#171d29"
textColor = "#ece8dc"

[server]
maxUploadSize = 100
enableXsrfProtection = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
